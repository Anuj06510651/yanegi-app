<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Yanegi</title>

  <!-- Open Graph / WhatsApp / iMessage rich preview -->
  <!-- Note: /event/** is handled by the eventPreview Cloud Function which serves
       per-event OG tags. This fallback is only reached for /profile/** and error
       states. og:title and og:description use property= not name= per the OG spec. -->
  <meta property="og:site_name"   content="Yanegi" />
  <meta property="og:type"        content="website" />
  <meta property="og:title"       content="Yanegi — Events near you" />
  <meta property="og:description" content="Discover and join local events. Meet people who share your vibe." />
  <meta name="twitter:card"       content="summary" />
  <meta name="twitter:title"      content="Yanegi — Events near you" />
  <meta name="twitter:description" content="Discover and join local events. Meet people who share your vibe." />
  <meta name="description"        content="Discover and join local events. Meet people who share your vibe." />
  <meta name="theme-color"        content="#0D1520" />

  <!-- iOS Smart App Banner (opens App Store if app not installed) -->
  <!-- Replace APP_STORE_ID with your real App Store numeric ID -->
  <!-- <meta name="apple-itunes-app" content="app-id=APP_STORE_ID" /> -->

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0D1520;
      --surface: #131A27;
      --border:  rgba(255,255,255,0.08);
      --primary: #22E7A2;
      --text:    #FFFFFF;
      --muted:   rgba(255,255,255,0.55);
      --radius:  16px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px 24px;
      max-width: 380px;
      width: 100%;
      text-align: center;
    }

    /* App logo mark */
    .logo {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, #22E7A2 0%, #1B8FFF 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin: 0 auto 20px;
    }

    .app-name {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .tagline {
      color: var(--muted);
      font-size: 14px;
      margin-top: 6px;
      line-height: 1.5;
    }

    /* Preview card (loaded from Firestore) */
    .preview {
      margin: 24px 0;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      text-align: left;
    }

    .preview-banner {
      width: 100%;
      height: 140px;
      object-fit: cover;
      display: block;
      background: rgba(255,255,255,0.06);
    }

    .preview-body {
      padding: 14px 16px;
    }

    .preview-label {
      font-size: 11px;
      font-weight: 600;
      color: #1B8FFF;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 6px;
    }

    .preview-title {
      font-size: 17px;
      font-weight: 700;
      line-height: 1.3;
    }

    .preview-sub {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
    }

    .preview-skeleton {
      background: linear-gradient(90deg, rgba(255,255,255,0.06) 25%, rgba(255,255,255,0.10) 50%, rgba(255,255,255,0.06) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 6px;
    }
    .preview-skeleton.tall  { height: 140px; }
    .preview-skeleton.h16   { height: 16px; width: 70%; margin: 4px 0; }
    .preview-skeleton.h12   { height: 12px; width: 50%; }

    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Buttons */
    .btn {
      display: block;
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.15s;
      text-align: center;
    }
    .btn:active { opacity: 0.82; }

    .btn-primary {
      background: var(--primary);
      color: #0D1520;
      margin-bottom: 10px;
    }

    .btn-secondary {
      background: rgba(255,255,255,0.08);
      color: var(--text);
    }

    .divider {
      color: var(--muted);
      font-size: 12px;
      margin: 16px 0;
    }

    .footer {
      margin-top: 32px;
      color: var(--muted);
      font-size: 12px;
    }
    .footer a { color: var(--primary); text-decoration: none; }
  </style>
</head>
<body>

<div class="card">
  <!-- App identity -->
  <div class="logo">🌍</div>
  <div class="app-name">Yanegi</div>
  <div class="tagline">Join events, meet people, live local.</div>

  <!-- Content preview (populated by JS) -->
  <div class="preview" id="preview">
    <div class="preview-skeleton tall"></div>
    <div class="preview-body">
      <div class="preview-skeleton h16"></div>
      <div class="preview-skeleton h12" style="margin-top:8px"></div>
    </div>
  </div>

  <!-- Action buttons -->
  <a class="btn btn-primary" id="btn-open" href="#">Open in Yanegi App</a>
  <div class="divider">Don't have the app?</div>
  <a class="btn btn-secondary" id="btn-store" href="#" target="_blank">Download Yanegi</a>
</div>

<div class="footer">
  <a href="https://yanegi.com">yanegi.com</a> &nbsp;·&nbsp;
  <a href="https://yanegi.com/privacy">Privacy</a>
</div>

<!-- Firebase JS SDK (compat) for Firestore read -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
  // ── Firebase init ──────────────────────────────────────────────────────────
  const firebaseConfig = {
    apiKey:            "AIzaSyAFa5071HC5_4zvOuhKb_4aWZrLrrfOrs0",
    authDomain:        "yanegi-684f9.firebaseapp.com",
    projectId:         "yanegi-684f9",
    storageBucket:     "yanegi-684f9.firebasestorage.app",
    messagingSenderId: "266662976182",
    appId:             "1:266662976182:web:placeholder"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // ── Parse the URL ──────────────────────────────────────────────────────────
  const path     = window.location.pathname;          // e.g. /event/abc123
  const segments = path.split('/').filter(Boolean);   // ['event', 'abc123']
  const type     = segments[0];                        // 'event' or 'profile'
  const id       = decodeURIComponent(segments[1] || '');

  const isEvent   = type === 'event';
  const isProfile = type === 'profile';

  // ── App store URLs (replace with real ones when published) ─────────────────
  const PLAY_STORE  = 'https://play.google.com/store/apps/details?id=com.yanegi.app';
  const APP_STORE   = 'https://apps.apple.com/app/yanegi/id0000000000'; // replace id when on App Store
  const isIOS       = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const isAndroid   = /Android/.test(navigator.userAgent);
  const storeUrl    = isIOS ? APP_STORE : PLAY_STORE;

  // ── Deep link to app (custom scheme + HTTPS for verified Android links) ────
  const appSchemeUrl = `yanegi://${type}/${id}`;
  const webUrl       = window.location.href;

  document.getElementById('btn-store').href = storeUrl;

  // ── Open in App button: try custom scheme, then intent (Android) ───────────
  document.getElementById('btn-open').addEventListener('click', function(e) {
    e.preventDefault();
    _tryOpenApp();
  });

  function _tryOpenApp() {
    if (isAndroid) {
      // Android intent URL opens app directly or Play Store as fallback.
      const pkg = 'com.yanegi.app';
      const intentUrl =
        `intent://${type}/${id}#Intent;scheme=yanegi;package=${pkg};` +
        `S.browser_fallback_url=${encodeURIComponent(storeUrl)};end`;
      window.location.href = intentUrl;
    } else if (isIOS) {
      // iOS: try custom scheme; if not installed, land on App Store after 1.5s.
      window.location.href = appSchemeUrl;
      setTimeout(() => { window.location.href = storeUrl; }, 1500);
    } else {
      // Desktop: just show the scheme (user can copy or scan QR later).
      window.location.href = appSchemeUrl;
    }
  }

  // ── Auto-try opening the app on page load (300ms delay feels intentional) ──
  setTimeout(_tryOpenApp, 300);

  // ── Firestore preview ──────────────────────────────────────────────────────
  async function loadPreview() {
    const previewEl = document.getElementById('preview');

    try {
      if (isEvent && id) {
        const doc = await db.collection('events').doc(id).get();
        if (!doc.exists) { _showNotFound(previewEl, 'Event not found'); return; }
        const d = doc.data();

        const bannerUrl   = d.bannerUrl || d.bannerImagePath || '';
        const title       = d.title || 'Yanegi Event';
        const location    = d.locationName || '';
        const participants = d.participantsCount || 0;
        const emoji       = d.eventAvatar || d.emoji || '📍';

        // Update OG tags dynamically (for WhatsApp cache busting, use server
        // side rendering — this is client-side so WhatsApp reads the defaults).
        document.title = `${title} · Yanegi`;

        previewEl.innerHTML = `
          ${bannerUrl
            ? `<img class="preview-banner" src="${_esc(bannerUrl)}" alt="${_esc(title)}" />`
            : `<div style="background:#1A2535;height:80px;display:flex;align-items:center;justify-content:center;font-size:36px">${_esc(emoji)}</div>`
          }
          <div class="preview-body">
            <div class="preview-label">📅 Event</div>
            <div class="preview-title">${_esc(title)}</div>
            ${location ? `<div class="preview-sub">📍 ${_esc(location)}</div>` : ''}
            ${participants ? `<div class="preview-sub">👥 ${participants} going</div>` : ''}
          </div>
        `;

      } else if (isProfile && id) {
        const doc = await db.collection('users').doc(id).get();
        if (!doc.exists) { _showNotFound(previewEl, 'Profile not found'); return; }
        const d = doc.data();

        const name     = d.name || d.displayName || 'Yanegi User';
        const username = d.username ? `@${d.username}` : '';
        const avatarUrl = d.photoUrl || d.avatarUrl || d.profileImage || '';
        const bio      = d.bio || '';

        document.title = `${name} · Yanegi`;

        previewEl.innerHTML = `
          <div class="preview-body" style="display:flex;align-items:center;gap:14px;padding:16px">
            ${avatarUrl
              ? `<img src="${_esc(avatarUrl)}" style="width:52px;height:52px;border-radius:50%;object-fit:cover;flex-shrink:0" />`
              : `<div style="width:52px;height:52px;border-radius:50%;background:#1B8FFF33;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0">👤</div>`
            }
            <div>
              <div class="preview-label">👤 Profile</div>
              <div class="preview-title">${_esc(name)}</div>
              ${username ? `<div class="preview-sub">${_esc(username)}</div>` : ''}
              ${bio ? `<div class="preview-sub" style="margin-top:4px;-webkit-line-clamp:2;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden">${_esc(bio)}</div>` : ''}
            </div>
          </div>
        `;

      } else {
        // Unknown route — show generic app card.
        previewEl.innerHTML = `
          <div class="preview-body" style="text-align:center;padding:20px">
            <div style="font-size:36px">🌍</div>
            <div class="preview-title" style="margin-top:8px">Discover local events</div>
            <div class="preview-sub">Find and join experiences near you</div>
          </div>
        `;
      }
    } catch (err) {
      console.error('Firestore load failed:', err);
      _showNotFound(previewEl, 'Could not load content');
    }
  }

  function _showNotFound(el, msg) {
    el.innerHTML = `<div class="preview-body" style="text-align:center;padding:24px;color:rgba(255,255,255,0.4)">${msg}</div>`;
  }

  function _esc(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  loadPreview();
</script>
</body>
</html>
