<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Yanegi — Join events, meet people, live local</title>
  <meta name="description" content="Discover and join local events. Meet people who share your vibe. Only on Yanegi." />
  <meta property="og:title"       content="Yanegi" />
  <meta property="og:description" content="Discover local events and meet people near you." />
  <meta property="og:type"        content="website" />
  <meta name="theme-color"        content="#0D1520" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0D1520;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .logo {
      width: 80px; height: 80px;
      border-radius: 22px;
      background: linear-gradient(135deg, #22E7A2 0%, #1B8FFF 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 40px;
      margin: 0 auto 24px;
    }
    h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
    p  { color: rgba(255,255,255,0.6); font-size: 15px; margin-top: 10px; line-height: 1.6; max-width: 320px; }
    .btn {
      display: inline-block;
      margin-top: 32px;
      padding: 14px 32px;
      background: #22E7A2;
      color: #0D1520;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="logo">🌍</div>
  <h1>Yanegi</h1>
  <p>Discover local events and meet people who share your vibe.</p>
  <a class="btn" href="https://play.google.com/store/apps/details?id=com.yanegi.app">Download the App</a>
</body>
</html>
